# Netlify deployment.
#
# The site is fully prerendered, so this is a static deploy — no functions, no
# server runtime. Everything Netlify-specific lives in this file and the
# generated _redirects; the contents of build/client are plain HTML, CSS,
# JS and images that any static host will serve.

[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

# Canonical tags and the sitemap are built from VITE_SITE_URL, so it must
# differ per context. If a preview inherits the production value it emits
# canonicals pointing at the live site, which tells Google those previews are
# duplicates of pages it cannot verify.
[context.production.environment]
  VITE_SITE_URL = "https://www.royalwoodshop.com"
  # Crawling stays off until the site is on its final host and the real
  # domain is attached. Set this to "on" then, and not before.
  VITE_SEARCH_INDEXING = "off"

[context.deploy-preview.environment]
  VITE_SITE_URL = "https://deploy-preview--royalwoodshop.netlify.app"

# Hashed asset filenames never change contents, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Belt and braces alongside robots.txt: robots.txt asks crawlers not to
    # look, this tells them not to index what they already fetched.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
